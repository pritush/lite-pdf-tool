# Nginx configuration for PDF Tool
# Add this to your nginx server block

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

# Cache static assets
location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # CORS headers for CDN resources
    add_header Access-Control-Allow-Origin "*";
}

# Cache HTML with revalidation
location ~* \.(html|htm)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
}

# CRITICAL: Cross-Origin Isolation headers for SharedArrayBuffer
# Required for Ghostscript WASM compression
location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Try files, fallback to index.html for SPA routing
    try_files $uri $uri/ /index.html;
}

# Service Worker must be served with correct MIME type
location = /service-worker.js {
    add_header Content-Type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}
