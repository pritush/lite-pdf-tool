<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Origin Isolation Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        .info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
        }
        h1 {
            color: #333;
        }
        code {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button.danger {
            background: #dc3545;
        }
        button.danger:hover {
            background: #c82333;
        }
        .actions {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🔒 Cross-Origin Isolation Test</h1>
    
    <div id="result" class="test-result info">
        Testing cross-origin isolation status...
    </div>

    <div id="sw-status" class="test-result info" style="display:none;">
        <strong>Service Worker Status:</strong><br>
        <span id="sw-state">Checking...</span>
    </div>

    <div class="actions">
        <button onclick="forceReload()">🔄 Hard Reload</button>
        <button onclick="unregisterSW()" class="danger">🗑️ Unregister Service Worker & Reload</button>
        <button onclick="checkStatus()">🔍 Check Status</button>
    </div>

    <div id="details"></div>

    <script>
        async function checkStatus() {
            const resultDiv = document.getElementById('result');
            const detailsDiv = document.getElementById('details');
            const swStatusDiv = document.getElementById('sw-status');
            const swStateSpan = document.getElementById('sw-state');
            
            // Check if cross-origin isolated
            const isIsolated = window.crossOriginIsolated;
            
            // Check SharedArrayBuffer availability
            const hasSharedArrayBuffer = typeof SharedArrayBuffer !== 'undefined';
            
            // Check service worker
            let swInfo = 'Not supported';
            if ('serviceWorker' in navigator) {
                swStatusDiv.style.display = 'block';
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (reg) {
                        const controller = navigator.serviceWorker.controller;
                        swInfo = controller 
                            ? `✅ Active and controlling (${reg.active?.scriptURL})`
                            : '⚠️ Registered but not controlling yet';
                        swStateSpan.innerHTML = swInfo;
                    } else {
                        swInfo = '❌ Not registered';
                        swStateSpan.innerHTML = swInfo;
                    }
                } catch (e) {
                    swInfo = '❌ Error: ' + e.message;
                    swStateSpan.innerHTML = swInfo;
                }
            }
            
            if (isIsolated && hasSharedArrayBuffer) {
                resultDiv.className = 'test-result success';
                resultDiv.innerHTML = `
                    <strong>✅ Success!</strong><br>
                    Cross-origin isolation is working correctly.<br>
                    SharedArrayBuffer is available for compression.
                `;
            } else if (!hasSharedArrayBuffer) {
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = `
                    <strong>❌ Failed</strong><br>
                    SharedArrayBuffer is NOT available.<br>
                    Cross-origin isolated: ${isIsolated ? 'Yes' : 'No'}<br><br>
                    <strong>Actions to try:</strong><br>
                    1. Click "Unregister Service Worker & Reload" below<br>
                    2. Wait for page to reload automatically<br>
                    3. If that doesn't work, try "Hard Reload"
                `;
            } else {
                resultDiv.className = 'test-result warning';
                resultDiv.innerHTML = `
                    <strong>⚠️ Partial Success</strong><br>
                    SharedArrayBuffer is available but cross-origin isolation is not detected.<br>
                    This may work but could be unreliable.
                `;
            }
            
            // Display details
            detailsDiv.innerHTML = `
                <div class="test-result info">
                    <strong>Technical Details:</strong><br>
                    <code>window.crossOriginIsolated</code>: ${isIsolated}<br>
                    <code>typeof SharedArrayBuffer</code>: ${typeof SharedArrayBuffer}<br>
                    <code>Service Worker</code>: ${swInfo}<br><br>
                    <strong>How it works:</strong><br>
                    The service worker intercepts page requests and injects:<br>
                    • <code>Cross-Origin-Opener-Policy: same-origin</code><br>
                    • <code>Cross-Origin-Embedder-Policy: credentialless</code><br><br>
                    These headers enable SharedArrayBuffer for WebAssembly threading.
                </div>
            `;
        }

        async function forceReload() {
            window.location.reload(true);
        }

        async function unregisterSW() {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    alert('Service worker unregistered. Page will reload...');
                    window.location.reload(true);
                } catch (e) {
                    alert('Error unregistering: ' + e.message);
                }
            } else {
                alert('Service workers not supported');
            }
        }

        // Auto-check on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
